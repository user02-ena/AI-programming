<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER帽子のおじさんブラザーズ</title>
    <style>
        /* 画面全体のスタイルをリセットし、縦方向の中央揃えにする */
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        
        /* ゲーム画面（キャンバス）のスタイル */
        canvas {
            background-color: #87CEEB; /* 空の水色 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* 影をつけて立体感を出す */
            border: 4px solid #fff;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        
        /* ゲームタイトルのスタイル */
        #title-container {
            margin-bottom: 10px;
            text-align: center;
        }

        #title-container h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #f1c40f;
            text-shadow: 2px 2px #c0392b;
        }

        /* 操作説明用のUIテキスト（画面の下側に配置） */
        #ui {
            margin-top: 15px;
            text-align: center;
            width: 100%;
            font-size: 14px;
            color: #bdc3c7;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 8px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="title-container">
        <h2>SUPER帽子のおじさんブラザーズ</h2>
    </div>

    <!-- ゲームを描画するためのキャンバス -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="ui">
        移動：左右矢印キー（← →） | ジャンプ：上矢印キー（↑）またはスペースキー | 土管の上で下キー：ワープ
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const keys = {
            left: false,
            right: false,
            up: false,
            down: false
        };

        let score = 0;
        let coins = 0;

        // プレイヤーの設定（遠くからでもブロックにしっかり乗れる超強化ジャンプ力）
        const player = {
            x: 50,
            y: 50,
            w: 30,
            h: 36,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpPower: -13.5, // さらに高く遠くまで跳べるジャンプ力
            gravity: 0.5,     // 重力を少し軽くして滞空時間を延長
            isGrounded: false,
            isBig: false,
            lives: 3,             // 3回までダメージに耐えられる
            invincibleTimer: 0,
            facing: 'right'
        };

        // ステージのブロックデータ（地面、足場、壁、3Dびっくりブロックなど）
        const blocks = [
            { x: 0, y: 350, w: 900, h: 50, type: 'ground', color: '#8B4513' }, // スタートの床
            { x: 1000, y: 350, w: 1000, h: 50, type: 'ground', color: '#8B4513' }, // 穴の先の床
            { x: 400, y: 240, w: 40, h: 40, type: 'question', hit: false }, // 3D風びっくりブロック1
            { x: 480, y: 240, w: 40, h: 40, type: 'block3d' },  // 3D風茶色ブロック1
            { x: 520, y: 240, w: 40, h: 40, type: 'question', hit: false }, // 3D風びっくりブロック2
            { x: 650, y: 160, w: 40, h: 40, type: 'block3d' },  // 3D風茶色ブロック2
            { x: 690, y: 160, w: 40, h: 40, type: 'question', hit: false }, // 3D風びっくりブロック3
            // 緑色のワープ土管（上に乗って下キーを押すとワープ！）
            { x: 800, y: 290, w: 50, h: 60, type: 'pipe', color: '#2ecc71', targetWorld: 2 },
            { x: 1300, y: 220, w: 40, h: 40, type: 'block3d' }, // 浮き島ブロック
            { x: 1340, y: 220, w: 40, h: 40, type: 'question', hit: false },
            { x: 1800, y: 300, w: 50, h: 50, type: 'goal', color: '#f1c40f' }     // ゴール（金色）
        ];

        // 別ワールド（ワープ先）のブロックデータ
        const world2Blocks = [
            { x: 0, y: 350, w: 1200, h: 50, type: 'ground', color: '#8e44ad' }, // 紫色の地下ワールド床
            { x: 300, y: 220, w: 60, h: 40, type: 'block3d' },
            { x: 360, y: 220, w: 60, h: 40, type: 'question', hit: false },
            { x: 700, y: 250, w: 50, h: 100, type: 'block3d' },
            // 地下ワールドから戻る土管
            { x: 900, y: 290, w: 50, h: 60, type: 'pipe', color: '#2ecc71', targetWorld: 1 },
            { x: 1100, y: 300, w: 50, h: 50, type: 'goal', color: '#f1c40f' }     // 地下ワールドのゴール
        ];

        let currentWorld = 1;
        let items = [];

        // フィールドをうろつく敵（栗ボー風）の配列
        const enemies = [
            { x: 600, y: 320, w: 30, h: 30, vx: -1.5, alive: true, patrolMin: 450, patrolMax: 700 },
            { x: 1200, y: 320, w: 30, h: 30, vx: -2, alive: true, patrolMin: 1050, patrolMax: 1400 },
            { x: 1500, y: 320, w: 30, h: 30, vx: -1.5, alive: true, patrolMin: 1400, patrolMax: 1700 }
        ];

        const world2Enemies = [
            { x: 450, y: 320, w: 30, h: 30, vx: -2, alive: true, patrolMin: 300, patrolMax: 650 }
        ];

        let cameraX = 0;
        let gameState = 'playing';

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') {
                keys.left = true;
                player.facing = 'left';
            }
            if (e.code === 'ArrowRight') {
                keys.right = true;
                player.facing = 'right';
            }
            if (e.code === 'ArrowDown') {
                keys.down = true;
                tryWarp();
            }
            if (e.code === 'ArrowUp' || e.code === 'Space') {
                keys.up = true;
                if ((gameState === 'gameover' || gameState === 'clear') && e.code === 'Space') {
                    restartGame();
                    return;
                }
                if (gameState === 'playing' && player.isGrounded) {
                    player.vy = player.jumpPower;
                    player.isGrounded = false;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'ArrowDown') keys.down = false;
            if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
        });

        // 土管ワープ機能
        function tryWarp() {
            if (gameState !== 'playing') return;
            const currentBlocks = currentWorld === 1 ? blocks : world2Blocks;
            for (let block of currentBlocks) {
                if (block.type === 'pipe' && checkCollision(player, block)) {
                    if (player.y + player.h === block.y) {
                        currentWorld = block.targetWorld;
                        player.x = 100;
                        player.y = 50;
                        player.vy = 0;
                        cameraX = 0;
                        break;
                    }
                }
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.w > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.h > rect2.y;
        }

        function update() {
            if (gameState !== 'playing') return;

            const currentBlocks = currentWorld === 1 ? blocks : world2Blocks;
            const currentEnemies = currentWorld === 1 ? enemies : world2Enemies;

            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
            }

            player.vy += player.gravity;
            player.y += player.vy;
            player.isGrounded = false;

            // ブロックとの縦方向の判定
            for (let block of currentBlocks) {
                if (checkCollision(player, block)) {
                    if (block.type === 'goal') {
                        gameState = 'clear';
                        return;
                    }

                    if (player.vy > 0) {
                        player.y = block.y - player.h;
                        player.vy = 0;
                        player.isGrounded = true;
                    } else if (player.vy < 0) {
                        player.y = block.y + block.h;
                        player.vy = 0;

                        // びっくりブロックを叩いたとき（コインや五平餅などが出現）
                        if (block.type === 'question' && !block.hit) {
                            block.hit = true;
                            const types = ['coin', 'kurikinton', 'gopheimochi', 'hobazushi'];
                            const chosenType = types[Math.floor(Math.random() * types.length)];
                            
                            items.push({
                                x: block.x + 4,
                                y: block.y - 32,
                                w: 32,
                                h: 32,
                                vx: chosenType === 'coin' ? 0 : 1,
                                vy: -4,
                                type: chosenType
                            });
                        }
                    }
                }
            }

            // 横方向の移動
            if (keys.left) {
                player.vx = -player.speed;
            } else if (keys.right) {
                player.vx = player.speed;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            for (let block of currentBlocks) {
                if (checkCollision(player, block) && block.type !== 'goal' && block.type !== 'pipe') {
                    if (player.vx > 0) {
                        player.x = block.x - player.w;
                    } else if (player.vx < 0) {
                        player.x = block.x + block.w;
                    }
                }
            }

            // アイテムの更新と取得判定
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                if (item.type !== 'coin') {
                    item.vy += player.gravity;
                    item.y += item.vy;

                    for (let block of currentBlocks) {
                        if (block.type !== 'goal' && block.type !== 'pipe' && checkCollision(item, block)) {
                            if (item.vy > 0) {
                                item.y = block.y - item.h;
                                item.vy = 0;
                            }
                        }
                    }
                    item.x += item.vx;
                }

                if (checkCollision(player, item)) {
                    if (item.type === 'coin') {
                        coins++;
                        score += 100;
                    } else {
                        // パワーアップ
                        if (!player.isBig) {
                            player.isBig = true;
                            player.y -= 16;
                            player.h = 52;
                        }
                        score += 1000;
                    }
                    items.splice(i, 1);
                }
            }

            // 敵の移動と衝突判定
            for (let enemy of currentEnemies) {
                if (!enemy.alive) continue;

                enemy.x += enemy.vx;
                if (enemy.x < enemy.patrolMin || enemy.x > enemy.patrolMax) {
                    enemy.vx *= -1;
                }

                if (checkCollision(player, enemy)) {
                    // 上から踏んだ場合
                    if (player.vy > 0 && player.y + player.h - player.vy <= enemy.y + 10) {
                        enemy.alive = false;
                        player.vy = -8;
                        score += 200;
                    } else {
                        // 横からぶつかった場合（ダメージ処理・複数回耐えられる）
                        if (player.invincibleTimer === 0) {
                            player.lives--;
                            player.invincibleTimer = 90; // 約1.5秒の無敵時間
                            
                            if (player.lives <= 0) {
                                gameState = 'gameover';
                            }
                        }
                    }
                }
            }

            if (player.y > canvas.height) {
                gameState = 'gameover';
            }

            const targetCameraX = player.x - canvas.width / 2;
            if (targetCameraX > 0) {
                cameraX = targetCameraX;
            } else {
                cameraX = 0;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const currentBlocks = currentWorld === 1 ? blocks : world2Blocks;
            const currentEnemies = currentWorld === 1 ? enemies : world2Enemies;

            // 背景描画（山や雲）
            if (currentWorld === 1) {
                ctx.fillStyle = '#78b5e9';
                ctx.beginPath();
                let mountainOffset = -(cameraX * 0.3) % 400;
                for (let i = -1; i < 6; i++) {
                    let mx = i * 400 + mountainOffset;
                    ctx.moveTo(mx, 350);
                    ctx.lineTo(mx + 200, 150);
                    ctx.lineTo(mx + 400, 350);
                }
                ctx.fill();

                ctx.fillStyle = '#5ca4d8';
                ctx.beginPath();
                let mountainOffset2 = -(cameraX * 0.5) % 300;
                for (let i = -1; i < 8; i++) {
                    let mx = i * 300 + mountainOffset2;
                    ctx.moveTo(mx, 350);
                    ctx.lineTo(mx + 150, 200);
                    ctx.lineTo(mx + 300, 350);
                }
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const cloudOffset = -(cameraX * 0.2);
                drawCloud(150 + (cloudOffset % 900), 70, 60);
                drawCloud(500 + (cloudOffset % 900), 50, 40);
                drawCloud(850 + (cloudOffset % 900), 90, 70);
            } else {
                ctx.fillStyle = '#2c163a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#4a235a';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('〜 地下ボーナスステージ 〜', canvas.width / 2, 50);
            }

            ctx.save();
            ctx.translate(-cameraX, 0);

            // ブロック描画
            for (let block of currentBlocks) {
                if (block.type === 'ground') {
                    ctx.fillStyle = currentWorld === 1 ? '#8B5A2B' : '#512e5f';
                    ctx.fillRect(block.x, block.y, block.w, block.h);

                    if (currentWorld === 1) {
                        ctx.fillStyle = '#654321';
                        for (let i = block.x + 10; i < block.x + block.w; i += 30) {
                            ctx.fillRect(i, block.y + 10, 8, 8);
                        }
                        ctx.fillStyle = '#2ecc71';
                        ctx.fillRect(block.x, block.y, block.w, 8);
                    }
                } 
                // 3D風茶色ブロック（立体的な枠線とグラデーション）
                else if (block.type === 'block3d') {
                    ctx.fillStyle = '#d2691e';
                    ctx.fillRect(block.x, block.y, block.w, block.h);
                    
                    ctx.fillStyle = '#f4a460';
                    ctx.fillRect(block.x, block.y, block.w, 4);
                    ctx.fillRect(block.x, block.y, 4, block.h);

                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(block.x, block.y + block.h - 4, block.w, 4);
                    ctx.fillRect(block.x + block.w - 4, block.y, 4, block.h);

                    ctx.strokeStyle = '#a0522d';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(block.x + 4, block.y + 4, block.w - 8, block.h - 8);
                } 
                // 3D風びっくりブロック（ハテナブロック）
                else if (block.type === 'question') {
                    ctx.fillStyle = block.hit ? '#95a5a6' : '#f1c40f';
                    ctx.fillRect(block.x, block.y, block.w, block.h);

                    if (!block.hit) {
                        ctx.fillStyle = '#f7dc6f';
                        ctx.fillRect(block.x, block.y, block.w, 4);
                        ctx.fillRect(block.x, block.y, 4, block.h);

                        ctx.fillStyle = '#b7950b';
                        ctx.fillRect(block.x, block.y + block.h - 4, block.w, 4);
                        ctx.fillRect(block.x + block.w - 4, block.y, 4, block.h);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 22px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('！', block.x + block.w / 2, block.y + block.h / 2);
                        ctx.textBaseline = 'alphabetic';
                    } else {
                        ctx.fillStyle = '#7f8c8d';
                        ctx.fillRect(block.x, block.y + block.h - 4, block.w, 4);
                    }
                } else if (block.type === 'pipe') {
                    ctx.fillStyle = '#27ae60';
                    ctx.fillRect(block.x, block.y, block.w, block.h);
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillRect(block.x - 4, block.y, block.w + 8, 14);
                } else if (block.type === 'goal') {
                    // ゴール地点（城壁とお城、金色の旗）
                    ctx.fillStyle = '#bdc3c7';
                    ctx.fillRect(block.x - 10, block.y - 70, 70, 120);
                    ctx.fillStyle = '#7f8c8d';
                    ctx.fillRect(block.x - 10, block.y - 90, 20, 20);
                    ctx.fillRect(block.x + 40, block.y - 90, 20, 20);
                    ctx.fillStyle = '#34495e';
                    ctx.fillRect(block.x + 15, block.y - 20, 20, 70); // 城のドア

                    // ポールと旗
                    ctx.fillStyle = '#ecf0f1';
                    ctx.fillRect(block.x + 22, block.y - 150, 6, 150);
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(block.x + 25, block.y - 150, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // ひらめく旗
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.moveTo(block.x + 28, block.y - 145);
                    ctx.lineTo(block.x + 65, block.y - 125);
                    ctx.lineTo(block.x + 28, block.y - 105);
                    ctx.fill();
                } else {
                    ctx.fillStyle = block.color;
                    ctx.fillRect(block.x, block.y, block.w, block.h);
                }
            }

            // アイテム描画
            for (let item of items) {
                if (item.type === 'coin') {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(item.x + item.w / 2, item.y + item.h / 2, item.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (item.type === 'kurikinton') {
                    ctx.fillStyle = '#d35400';
                    ctx.beginPath();
                    ctx.arc(item.x + 16, item.y + 16, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (item.type === 'gopheimochi') {
                    // 五平餅（本体＋木の棒付き）
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(item.x + 14, item.y + 18, 4, 14); // 木の棒
                    
                    ctx.fillStyle = '#d4ac0d';
                    ctx.beginPath();
                    ctx.ellipse(item.x + 16, item.y + 14, 12, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (item.type === 'hobazushi') {
                    ctx.fillStyle = '#27ae60';
                    ctx.fillRect(item.x + 4, item.y + 8, 24, 16);
                }
            }

            // 敵（栗ボー）描画
            for (let enemy of currentEnemies) {
                if (!enemy.alive) continue;
                const ex = enemy.x;
                const ey = enemy.y;
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 15, 15, Math.PI, 0, false);
                ctx.fill();
                ctx.fillRect(ex + 2, ey + 15, 26, 12);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(ex + 6, ey + 14, 6, 8);
                ctx.fillRect(ex + 18, ey + 14, 6, 8);
                ctx.fillStyle = '#000000';
                ctx.fillRect(ex + 8, ey + 17, 3, 4);
                ctx.fillRect(ex + 20, ey + 17, 3, 4);
            }

            // プレイヤー描画
            if (player.invincibleTimer % 4 < 2) {
                const px = player.x;
                const py = player.y;
                const ph = player.h;

                // 足
                ctx.fillStyle = '#78281f';
                if (keys.left || keys.right) {
                    const step = Math.floor(Date.now() / 100) % 2;
                    ctx.fillRect(px + 4, py + ph - 6, 8, 6);
                    ctx.fillRect(px + 20 + (step === 0 ? 2 : -2), py + ph - 6, 8, 6);
                } else {
                    ctx.fillRect(px + 4, py + ph - 6, 8, 6);
                    ctx.fillRect(px + 20, py + ph - 6, 8, 6);
                }

                // 服（青）
                ctx.fillStyle = '#2980b9';
                ctx.fillRect(px + 4, py + (ph === 52 ? 24 : 16), 24, ph === 52 ? 22 : 14);

                // シャツ・顔（肌色）
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(px + 6, py + (ph === 52 ? 14 : 10), 20, 14);

                // ひげ
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(px + 8, py + (ph === 52 ? 22 : 18), 16, 5);

                // 青い帽子
                ctx.fillStyle = '#3498db';
                ctx.fillRect(px + 4, py + 4, 24, 8);
                if (player.facing === 'right') {
                    ctx.fillRect(px + 18, py + 10, 12, 3);
                } else {
                    ctx.fillRect(px + 2, py + 10, 12, 3);
                }
            }

            ctx.restore();

            // スコア・コインUI描画
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(26, 25, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillText(`× ${coins}`, 40, 25);
            ctx.fillText(`SCORE : ${score}`, 140, 25);
            ctx.fillStyle = '#e74c3c';
            ctx.fillText(`♥ × ${player.lives}`, 290, 25);

            ctx.textBaseline = 'alphabetic';

            // ゲーム終了メッセージ（クリアまたはゲームオーバー）
            if (gameState === 'clear') {
                ctx.fillStyle = 'rgba(20, 20, 40, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 44px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('✨ GAME CLEAR! ✨', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#ecf0f1';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(`おめでとう！ スコア: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillStyle = '#f39c12';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('【 スペースキー をおして もう1回プレイする 】', canvas.width / 2, canvas.height / 2 + 65);
            } else if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(20, 20, 30, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 42px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(' GAME OVER ', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#ecf0f1';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('ざんねん！ もういちど チャレンジしてね！', canvas.width / 2, canvas.height / 2 + 25);
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('【 スペースキー をおして リスタート 】', canvas.width / 2, canvas.height / 2 + 65);
            }
        }

        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.4, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            gameState = 'playing';
            currentWorld = 1;
            score = 0;
            coins = 0;
            cameraX = 0;
            
            player.x = 50;
            player.y = 50;
            player.vx = 0;
            player.vy = 0;
            player.isBig = false;
            player.h = 36;
            player.lives = 3;
            player.invincibleTimer = 0;
            
            blocks.forEach(block => { if (block.type === 'question') block.hit = false; });
            world2Blocks.forEach(block => { if (block.type === 'question') block.hit = false; });
            items = [];
            
            enemies[0] = { x: 600, y: 320, w: 30, h: 30, vx: -1.5, alive: true, patrolMin: 450, patrolMax: 700 };
            enemies[1] = { x: 1200, y: 320, w: 30, h: 30, vx: -2, alive: true, patrolMin: 1050, patrolMax: 1400 };
            enemies[2] = { x: 1500, y: 320, w: 30, h: 30, vx: -1.5, alive: true, patrolMin: 1400, patrolMax: 1700 };
            world2Enemies[0] = { x: 450, y: 320, w: 30, h: 30, vx: -2, alive: true, patrolMin: 300, patrolMax: 650 };
        }

        gameLoop();
    </script>
</body>
